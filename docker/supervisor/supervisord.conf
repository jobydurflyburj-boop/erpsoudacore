; Real supervisor configuration — an alternative to docker-compose's
; separate app/queue/scheduler containers, for hosts that only support
; a single container (some simple VPS/PaaS setups don't offer
; multi-container orchestration). Selected by setting
; SUPERVISOR_MODE=true (see docker/php/entrypoint.sh) — the default
; docker-compose.yml path does NOT use this; it keeps php-fpm, the
; queue worker, and the scheduler as three separate, independently
; restartable/scalable containers, which is the better default for
; anything that can support it. This file exists for the hosts that
; can't.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
user=www-data
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/artisan queue:work redis --tries=3 --backoff=5 --sleep=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; A real scheduler loop — ticks schedule:run every 60 seconds, the
; same interval docker-compose.yml's dedicated `scheduler` service
; uses. See routes/console.php for what's actually scheduled
; (reports:process-scheduled hourly, backup:database daily).
[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/artisan schedule:run --verbose --no-interaction; sleep 60; done"
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
