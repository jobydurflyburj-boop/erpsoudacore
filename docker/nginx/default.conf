# Production Readiness — hardened nginx config. The Foundation-sprint
# version worked for local development but had three real gaps this
# sprint closes: no gzip (real bandwidth/latency cost on every JSON
# response), no request-rate limiting at the web-server layer (the
# app-layer `throttle:auth`/`throttleApi` limiters — see
# app/Providers/AppServiceProvider.php — are the real enforcement,
# this is defense-in-depth so a flood never even reaches PHP-FPM), and
# security headers only at the Laravel-middleware layer (SecurityHeaders)
# with none set here as a second layer for responses PHP never touches
# (404s nginx serves directly, static assets).

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types application/json application/javascript text/css text/plain application/xml;

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Wildcard subdomain routing: *.soudacore.app all hit this same server
    # block; tenant resolution happens in app/Http/Middleware/ResolveTenant.php
    # from the Host header, not at the web-server layer.

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    access_log /var/log/nginx/soudacore-access.log;
    error_log /var/log/nginx/soudacore-error.log warn;

    # Auth endpoints get the tighter zone — mirrors the app-layer
    # `throttle:auth` limiter (app/Providers/AppServiceProvider.php),
    # applied here too as defense-in-depth, not a replacement for it.
    location ~ ^/api/v1/(auth|public/tenants/register|admin/auth/login) {
        limit_req zone=api_auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        include fastcgi_params;
    }

    # Deny every dotfile (.env, .git, etc.) and every path Laravel
    # itself never serves publicly (storage/, bootstrap/cache/) even
    # if a misconfiguration ever made `root` point somewhere wrong.
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~ ^/(storage|bootstrap/cache|vendor|database|tests|docs)/ {
        deny all;
    }
}
